<div style="background:#f3ead2;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#fffcf5;border-radius:10px;overflow:hidden;">
    <div style="background:#ffffff;padding:20px 32px;border-bottom:3px solid #006547;">
      <img src="{{ logo_url }}" alt="Irritec" height="40" style="display:block;height:40px;width:auto;">
    </div>
    <div style="padding:32px;">
      <p style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#006547;margin:0 0 8px;">{% block eyebrow %}Mesa de ayuda TI{% endblock %}</p>
      <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:23px;color:#2b2318;margin:0 0 16px;">{% block titulo %}{% endblock %}</h1>
      <div style="font-size:15px;line-height:1.55;color:#2b2318;">
        {% block cuerpo %}{% endblock %}
      </div>
      {% block cta %}{% endblock %}
      <p style="font-size:12px;color:#9c9280;margin-top:32px;border-top:1px solid rgba(43,35,24,0.14);padding-top:16px;">Mensaje automatico de la mesa de ayuda TI &middot; Irritec.</p>
    </div>
  </div>
</div>
