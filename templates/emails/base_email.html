<div style="background:#14171b;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#f2eee3;border-radius:6px;padding:32px;">
    <p style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#b23a2e;margin:0 0 8px;">{% block eyebrow %}Mesa de ayuda TI{% endblock %}</p>
    <h1 style="font-size:22px;color:#1e2a38;margin:0 0 16px;">{% block titulo %}{% endblock %}</h1>
    <div style="font-size:15px;line-height:1.55;color:#1e2a38;">
      {% block cuerpo %}{% endblock %}
    </div>
    {% block cta %}{% endblock %}
    <p style="font-size:12px;color:#8b8577;margin-top:32px;border-top:1px solid rgba(30,42,56,0.14);padding-top:16px;">Mensaje automatico de la mesa de ayuda TI.</p>
  </div>
</div>
